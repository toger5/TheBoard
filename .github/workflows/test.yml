on: 
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - "**"
    tags:
      - "!v**"
  

name: Build test

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: install files
        run: yarn install --frozen-lockfile
      - name: run tests
        run: yarn build
      - name: run tests
        run: yarn run test
      - uses: actions/upload-artifact@v4
        with:
          name: builds
          path: dist/

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - name: install files
        run: yarn install --frozen-lockfile
      - name: install the browser
        run: yarn e2e:install --with-deps
      - name: run the e2e tests against the hosted widget-host
        run: yarn e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results
          path: test-results/
