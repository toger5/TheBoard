on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

name: Build and release

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # see: https://github.com/actions/checkout/issues/290
      - name: Fetch Tags
        run: git fetch --force --tags
        
      # widget-base-sdk is linked from a sibling checkout (package.json: file:../matrix-widget-tools-sdk/...).
      - name: Check out matrix-widget-tools-sdk
        run: git clone --depth 1 https://github.com/toger5/matrix-widget-sdk.git ../matrix-widget-tools-sdk
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: Build widget-base-sdk
        working-directory: ../matrix-widget-tools-sdk
        run: wasm-pack build crates/widget-base-sdk --target web --release
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      # build the app
      - name: install
        run: yarn install --frozen-lockfile
      - name: build
        run: yarn build
        
      - name: gitignore on the target branch
        run: cp .gitignore dist/
      # VARIOUS DEPLOYS
      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@4.1.4
        with:
          branch: pages # The branch the action should deploy to.
          folder: dist # The folder the action should deploy.
        if: ${{ !contains(github.ref, '-') }} # not prerelease
          
      - name: Add to IPFS
        id: ipfs
        uses: anantaramdas/ipfs-pinata-deploy-action@v1.6.4 
        with:
          pin-name: 'theboard'
          path: './dist'
          pinata-api-key: ${{ secrets.PINATAAPIKEY }}
          pinata-secret-api-key: ${{ secrets.PINATASECRETAPIKEY }}
          verbose: true
          remove-old: true
        if: ${{ !contains(github.ref, '-') }} # not prerelease

      # prepare release files
      - name: Archive Release
        uses: thedoctor0/zip-release@4fb9e4ff72847dd3d1c111cf63834e353ed7cb3d
        with:
          type: 'zip'
          filename: './the-board-files.zip'
          path: dist
      - name: Archive Release
        uses: thedoctor0/zip-release@4fb9e4ff72847dd3d1c111cf63834e353ed7cb3d
        with:
          type: 'tar'
          filename: './the-board-files.tar.gz'
          path: dist
            
      - name: Add CID to release
        run: 'echo ${{ steps.ipfs.outputs.HASH }} > ./ipfs-cid.txt'
        if: ${{ !contains(github.ref, '-') }} # not prerelease

      # GitHub Release
      - name: Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: the-board-files*,ipfs-cid.txt
          prerelease: ${{ contains(github.ref, '-') }}
          token: ${{ secrets.GITHUB_TOKEN }}
